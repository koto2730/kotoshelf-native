[package]
name = "kotoshelf"
version = "0.1.0"
edition = "2021"
authors = ["koto2730oss"]
description = "Fast, minimalist markdown note editor and personal knowledge base"
license = "MIT"

[dependencies]
agent-protocol = { path = "agent-protocol" }
eframe = "0.36.1"
egui = "0.36.1"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
globset = "0.4.19"
trash = "5.2.6"
dirs = "6.0.0"
syntect = "5.3.0"
egui_commonmark = "0.25.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "blocking"] }
# egui_commonmark_backend depends on egui_extras with `default-features =
# false` and no features of its own - without a direct dependency here
# enabling "file"/"image" (Cargo unifies features for a shared crate
# version across the whole build), no BytesLoader for `file://` URIs and
# no PNG/JPEG decoder ever get installed, so every preview-pane image
# silently renders as a broken-image icon. Declared here purely to turn
# those features on project-wide; nothing in this crate calls into
# egui_extras directly.
egui_extras = { version = "0.36.1", default-features = false, features = ["all_loaders"] }
# egui_extras's own "image"/"all_loaders" features pull in the `image`
# crate with `default-features = false` and only forward its own "gif"/
# "webp" features to it - PNG/JPEG/BMP decoding needs those `image`
# crate features turned on directly here (again relying on Cargo's
# feature unification for the shared `image` crate instance), or every
# PNG/JPEG reference silently renders as a broken-image icon despite the
# URI/file-loading machinery above working correctly.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = "3"
dark-light = "2"
keyring = "3"

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = [
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Win32_Foundation",
    "Win32_UI_Input_Ime",
] }
raw-window-handle = "0.6"

[target."cfg(windows)".build-dependencies]
winres = "0.1.12"

[package.metadata.packager]
product-name = "kotoshelf"
identifier = "com.ictglabo.kotoshelf"
authors = ["koto2730oss"]
publisher = "koto2730oss"
icons = ["icon.ico", "icon.png"]

[[package.metadata.packager.file-associations]]
extensions = ["md", "markdown"]
name = "Markdown"
description = "Markdown Document"
mime-type = "text/markdown"

[package.metadata.packager.deb]
desktop-template = "assets/kotoshelf.desktop"
section = "editors"
priority = "optional"

[package.metadata.packager.nsis]
preinstall-section = '''
Section "ContextMenuAndPath"
  ; 1. File context menu: right-click any file -> "Open with kotoshelf"
  WriteRegStr SHCTX "Software\Classes\*\shell\kotoshelf" "" "Open with kotoshelf"
  WriteRegStr SHCTX "Software\Classes\*\shell\kotoshelf" "Icon" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\",0"
  WriteRegStr SHCTX "Software\Classes\*\shell\kotoshelf\command" "" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\" $\"%1$\""

  ; 2. Folder context menu: right-click a folder -> "Open with kotoshelf"
  WriteRegStr SHCTX "Software\Classes\Directory\shell\kotoshelf" "" "Open with kotoshelf"
  WriteRegStr SHCTX "Software\Classes\Directory\shell\kotoshelf" "Icon" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\",0"
  WriteRegStr SHCTX "Software\Classes\Directory\shell\kotoshelf\command" "" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\" $\"%1$\""

  ; 3. Folder background context menu: right-click inside a folder -> "Open with kotoshelf"
  WriteRegStr SHCTX "Software\Classes\Directory\Background\shell\kotoshelf" "" "Open with kotoshelf"
  WriteRegStr SHCTX "Software\Classes\Directory\Background\shell\kotoshelf" "Icon" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\",0"
  WriteRegStr SHCTX "Software\Classes\Directory\Background\shell\kotoshelf\command" "" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\" $\"%V$\""

  ; 4. Add $INSTDIR to user PATH without duplicates and broadcast WM_SETTINGCHANGE
  nsExec::ExecToLog 'powershell -NoProfile -NonInteractive -WindowStyle Hidden -Command "$p = [Environment]::GetEnvironmentVariable(\"Path\", \"User\"); $dir = \"$INSTDIR\"; if (-not (($p -split \";\") -contains $dir)) { [Environment]::SetEnvironmentVariable(\"Path\", ($p.TrimEnd(\";\") + \";\" + $dir).TrimStart(\";\"), \"User\") }"'
  SendMessage ${HWND_BROADCAST} ${WM_WININICHANGE} 0 "STR:Environment" /TIMEOUT=5000
SectionEnd

Section "un.ContextMenuAndPath"
  DeleteRegKey SHCTX "Software\Classes\*\shell\kotoshelf"
  DeleteRegKey SHCTX "Software\Classes\Directory\shell\kotoshelf"
  DeleteRegKey SHCTX "Software\Classes\Directory\Background\shell\kotoshelf"

  nsExec::ExecToLog 'powershell -NoProfile -NonInteractive -WindowStyle Hidden -Command "$p = [Environment]::GetEnvironmentVariable(\"Path\", \"User\"); $dir = \"$INSTDIR\"; if ($p) { $new = (($p -split \";\") | Where-Object { $_ -and ($_ -ne $dir) }) -join \";\"; [Environment]::SetEnvironmentVariable(\"Path\", $new, \"User\") }"'
  SendMessage ${HWND_BROADCAST} ${WM_WININICHANGE} 0 "STR:Environment" /TIMEOUT=5000
SectionEnd
'''

[package.metadata.deb]
maintainer = "koto2730oss"
depends = "$auto"
section = "editors"
priority = "optional"
assets = [
    ["target/release/kotoshelf", "usr/bin/", "755"],
    ["assets/kotoshelf.desktop", "usr/share/applications/", "644"],
    ["icon.png", "kotoshelf.png", "644"],
]

# Linux arm64 (aarch64) 向け deb パッケージ設定 (amd64 と同等の構成)
[package.metadata.deb.variants.arm64]
name = "kotoshelf"
maintainer = "koto2730oss"
depends = "$auto"
section = "editors"
priority = "optional"
assets = [
    # aarch64 向けクロスコンパイルバイナリのパス
    ["target/aarch64-unknown-linux-gnu/release/kotoshelf", "usr/bin/", "755"],
    ["assets/kotoshelf.desktop", "usr/share/applications/", "644"],
    ["icon.png", "kotoshelf.png", "644"],
]

[package.metadata.deb.variants.aarch64]
name = "kotoshelf"
maintainer = "koto2730oss"
depends = "$auto"
section = "editors"
priority = "optional"
assets = [
    # aarch64 向けクロスコンパイルバイナリのパス
    ["target/aarch64-unknown-linux-gnu/release/kotoshelf", "usr/bin/", "755"],
    ["assets/kotoshelf.desktop", "usr/share/applications/", "644"],
    ["icon.png", "kotoshelf.png", "644"],
]

